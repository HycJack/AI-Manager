name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '20'
  # Pin the CLI to the exact version in go.mod. Never use @latest: a newer CLI
  # generating bindings against an older library can fail, and if a future
  # release moves the cmd/wails3 package the install step breaks outright, which
  # then surfaces downstream as "wails3: command not found".
  WAILS_VERSION: 'v3.0.0-beta.14'

jobs:
  # ── macOS (universal) ──────────────────────────────────
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install wails3 CLI (pinned to go.mod)
        # shell: bash — the GOBIN= prefix below is POSIX inline-assignment
        # syntax; PowerShell (windows-2022's default shell) rejects it with
        # "The term 'GOBIN=...' is not recognized".
        shell: bash
        env:
          WAILS_VERSION: ${{ env.WAILS_VERSION }}
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify wails3 CLI
        run: wails3 version

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Generate bindings (TypeScript)
        # -clean/-time-type/-ts mirror build/Taskfile.yml:generate:bindings.
        # -f '<BUILD_FLAGS>' is intentionally omitted: the repo's only build
        # tags are platform entry points (build/ios, build/android), so no
        # desktop method is tag-gated and the flag would not change output.
        run: wails3 generate bindings -clean=true -time-type=Date -ts

      - name: Build (universal)
        # wails3 build emits a single-arch binary. build:universal lipo-merges
        # amd64 + arm64 into bin/ai-manager, which is what the bundle below
        # ships.
        run: wails3 task darwin:build:universal

      - name: Package (app bundle)
        # `wails3 package` takes no flags in v3.0.0-beta.14: the platform comes
        # from the runner's Taskfile. The old "wails3 package -platform darwin
        # -arch universal" died with "flag provided but not defined: -platform"
        # on every run, and continue-on-error hid it -- so no installer was
        # ever actually built and the artifacts were silently empty.
        run: wails3 task darwin:create:app:bundle

      - name: Package (DMG)
        run: wails3 task darwin:create:dmg

      - name: Upload binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-manager-macos
          path: bin/ai-manager

      - name: Upload app bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-manager-macos-app
          path: bin/ai-manager.app

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-manager-macos-dmg
          path: bin/*.dmg

  # ── Windows ────────────────────────────────────────────
  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install wails3 CLI (pinned to go.mod)
        # shell: bash — the GOBIN= prefix below is POSIX inline-assignment
        # syntax; PowerShell (windows-2022's default shell) rejects it with
        # "The term 'GOBIN=...' is not recognized".
        shell: bash
        env:
          WAILS_VERSION: ${{ env.WAILS_VERSION }}
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify wails3 CLI
        run: wails3 version

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Generate bindings (TypeScript)
        # -clean/-time-type/-ts mirror build/Taskfile.yml:generate:bindings.
        # -f '<BUILD_FLAGS>' is intentionally omitted: the repo's only build
        # tags are platform entry points (build/ios, build/android), so no
        # desktop method is tag-gated and the flag would not change output.
        run: wails3 generate bindings -clean=true -time-type=Date -ts

      - name: Build
        run: wails3 build

      - name: Package (NSIS)
        # No -platform flag: it does not exist in v3.0.0-beta.14 and made this
        # step fail every run. continue-on-error was hiding that failure.
        run: wails3 package

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-manager-windows
          # Matches both the raw bin/ai-manager.exe and the NSIS installer.
          path: bin/*.exe

  # ── Linux ──────────────────────────────────────────────
  linux:
    name: Linux
    # 24.04 is required, not just newer: wails3 links GTK4 + WebKitGTK 6.0,
    # and libwebkitgtk-6.0-dev does not exist on 22.04 (WebKitGTK 2.36).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # The ubuntu-24.04 runner ships a Google Chrome apt repo that
          # currently returns "Hash Sum mismatch" on every fetch -- retried
          # twice, failed both times, so it is stable rather than flaky. That
          # makes apt-get update exit 100 and kills this step before any
          # package is installed. We don't use Chrome, so drop the source; the
          # install below is the real check.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || true
          # libgtk-4-dev + libwebkitgtk-6.0-dev are needed by BOTH steps below:
          # `go install` compiles wails3's cgo operatingsystem package, and the
          # later `wails3 build` compiles the app itself.
          sudo apt-get install -y gcc libgl1-mesa-dev libxkbcommon-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install wails3 CLI (pinned to go.mod)
        # shell: bash — the GOBIN= prefix below is POSIX inline-assignment
        # syntax; PowerShell (windows-2022's default shell) rejects it with
        # "The term 'GOBIN=...' is not recognized".
        shell: bash
        env:
          WAILS_VERSION: ${{ env.WAILS_VERSION }}
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify wails3 CLI
        run: wails3 version

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Generate bindings (TypeScript)
        # -clean/-time-type/-ts mirror build/Taskfile.yml:generate:bindings.
        # -f '<BUILD_FLAGS>' is intentionally omitted: the repo's only build
        # tags are platform entry points (build/ios, build/android), so no
        # desktop method is tag-gated and the flag would not change output.
        run: wails3 generate bindings -clean=true -time-type=Date -ts

      - name: Build
        run: wails3 build

      - name: Package (AppImage + deb + rpm + AUR)
        # No -platform flag: it does not exist in v3.0.0-beta.14 and made this
        # step fail every run. continue-on-error was hiding that failure. The
        # deb/rpm/AUR outputs come from `wails3 tool package` (nFPM, pure Go),
        # so they need no dpkg/rpm toolchain on the runner.
        run: wails3 package

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-manager-linux
          # Binary plus every package format: .AppImage, .deb, .rpm, AUR
          path: bin/*

  # ── GitHub Release on tag ──────────────────────────────
  release:
    name: GitHub Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List files
        run: find dist -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
          body: |
            ## AI-Manager v${{ github.ref_name }}

            Cross-platform Agent Skills manager.

            ### Installation
            - **macOS**: Open the .dmg and drag to Applications
            - **Windows**: Run the .exe installer
            - **Linux**: Run the AppImage directly, or install to /usr/local/bin

            ### Notes
            - First run may require creating the data directory manually:
              - macOS: `mkdir -p ~/Library/Application\ Support/AIManager`
              - Windows: `%APPDATA%/AIManager/` (created automatically)
              - Linux: `~/.local/share/AIManager/` (created automatically)
